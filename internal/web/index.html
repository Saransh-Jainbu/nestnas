async function personView(id) {
  const m = $("main");
  let d, all;
  try { d = await api("/api/people/photos?id=" + encodeURIComponent(id)); all = await api("/api/people?hidden=1"); } catch (e) { state.person = null; return tabPeople(); }
  const photos = d.photos.map(p => ({ name: p.name, path: p.path, kind: "image" }));
  m.innerHTML = head("03", "Photos", "", d.name || "Unnamed person", `${d.photos.length} photo${d.photos.length === 1 ? "" : "s"}${d.hidden ? " · hidden" : ""}`) + `
    <div class="toolbar" style="margin:0 0 14px"><button class="ghost" id="pb">${ico("chev").replace("<svg ", '<svg style="transform:scaleX(-1)" ')} All people</button><span style="flex:1"></span>
      <button class="ghost" id="pn">${ico("edit")} ${d.name ? "Rename" : "Add a name"}</button><button class="ghost" id="pm">Merge into…</button><button class="ghost" id="ph2">${d.hidden ? "Show" : "Hide"}</button></div>
    <div class="gal">${d.photos.map((p, i) => `<div class="gcard" data-i="${i}"><div class="gimg"><img loading="lazy" alt="" src="/api/thumb?path=${encodeURIComponent(p.path)}&w=320"><button class="ib" data-x="${i}" title="This is not ${esc(d.name || "this person")}" aria-label="Not this person" style="position:absolute;top:8px;right:8px;z-index:2;background:rgba(5,8,12,.7);width:34px;height:34px">${ico("x")}</button></div><div class="gname">${esc(p.name)}</div></div>`).join("")}</div>`;
  $("pb").onclick = () => { state.person = null; tabPeople(); };
  const edit = op => guard(async (extra) => { const r = await api("/api/people/edit", { body: Object.assign({ op, id }, extra) }); return r; });
  $("pn").onclick = guard(async () => {
    const n = prompt("Name (use the same name as another group to join them)", d.name || ""); if (n === null) return;
    const r = await api("/api/people/edit", { body: { op: "rename", id, name: n } });
    if (r.merged_into) state.person = r.merged_into; personView(state.person);
  });
  $("pm").onclick = () => {
    const others = all.people.filter(p => p.id !== id);
    if (!others.length) { toast("There is no one else to merge with"); return; }
    sheet("Merge into", others.slice(0, 30).map(p => ({ icon: "smile", label: (p.name || "Unnamed") + ` (${p.photos})`, run: guard(async () => { await api("/api/people/edit", { body: { op: "merge", id, to: p.id } }); state.person = p.id; personView(p.id); }) })));
  };
  $("ph2").onclick = guard(async () => { await api("/api/people/edit", { body: { op: "hide", id, hidden: !d.hidden } }); if (!d.hidden) { state.person = null; tabPeople(); } else personView(id); });
  m.querySelectorAll("[data-i]").forEach(c => c.onclick = () => openViewer(photos, +c.dataset.i));
  m.querySelectorAll("[data-x]").forEach(b => b.onclick = guard(async ev => { ev.stopPropagation(); const p = d.photos[+b.dataset.x]; if (confirm("Remove this photo from " + (d.name || "this person") + "?")) { await api("/api/people/edit", { body: { op: "notthis", id, face: p.face } }); personView(id); } }));
}

/* ---------------- Trash ---------------- */
async function tabTrash() {
  const m = $("main"); const d = await api("/api/trash");
  m.innerHTML = head("04", "Storage", "", "Trash", `Deleted items are kept for ${d.days} days and then removed automatically. Items in the trash count toward your storage until it is emptied.`) + `
  <div class="card">${d.items.length ? `<div class="toolbar" style="margin:0 0 6px"><span style="flex:1"></span><button class="danger" id="empty">${ico("trash")} Empty trash</button></div>` : ""}
  <div class="tscroll"><table><thead><tr><th>Name</th><th class="hide-sm">Was in</th><th class="hide-sm">Size</th><th>Deleted</th><th></th></tr></thead><tbody>${d.items.map(i => `<tr><td><span class="ttl"><span class="ft k-${i.dir ? "folder" : "file"}" style="width:36px;height:36px;border-radius:11px">${ico(i.dir ? "folder" : "file")}</span>${esc(i.name)}</span></td>
  <td class="hide-sm mute mono small">${esc(i.orig.slice(0, i.orig.lastIndexOf("/")) || "/")}</td><td class="hide-sm mute mono small">${fmt(i.size)}</td><td class="mute mono small">${new Date(i.deleted * 1000).toLocaleDateString()}</td>
  <td class="actions"><button class="ghost" data-r="${esc(i.id)}">${ico("restore")} Restore</button><button class="danger" data-d="${esc(i.id)}">Delete forever</button></td></tr>`).join("") || `<tr><td colspan="5"><div class="empty" style="padding:34px 0">${NEST}<b>The trash is empty</b><span>Deleted items appear here.</span></div></td></tr>`}</tbody></table></div></div>`;
  m.querySelectorAll("[data-r]").forEach(b => b.onclick = guard(async () => { const r = await api("/api/trash/restore", { body: { id: b.dataset.r } }); toast("Restored to " + r.restored); tabTrash(); }));
  m.querySelectorAll("[data-d]").forEach(b => b.onclick = guard(async () => { if (confirm("Delete forever? This can't be undone.")) { await api("/api/trash/delete", { body: { id: b.dataset.d } }); tabTrash(); } }));
  const e = $("empty"); if (e) e.onclick = guard(async () => { if (confirm("Permanently delete everything in the trash?")) { await api("/api/trash/empty", { body: {} }); tabTrash(); } });
}

/* ---------------- Connect ---------------- */
async function tabConnect() {
  const m = $("main"); const s = state.sys = await api("/api/system"); state.me = await api("/api/me");
  const base = s.urls[0] || "http://YOUR-IP:8080"; const hostport = base.replace(/^http:\/\//, "").replace(/^https:\/\//, "");
  const r = s.remote;
  m.innerHTML = head("05", "Network", "Connect", "devices", "Ways to reach your NAS from other devices.") + `
  <div class="card">${cardHead("wifi", `Local <em>network</em>`)}<p class="mute small">Open any of these on a phone or another computer on the same network. They are encrypted (HTTPS); on a new device install the certificate first (<b>Security</b> tab).</p>
    ${s.urls.map(u => `<div style="margin:6px 0"><code>${esc(u)}</code></div>`).join("") || "<div class='mute'>No network detected.</div>"}</div>
  <div class="card">${cardHead("drive", `Network <em>drive</em>`, `<span class="pill ok">Built in</span>`)}
    <p class="small">Mount your NAS like a normal drive. Sign in with your <b>NestNAS username and password</b>; you only see your own folder.</p>
    <pre>${esc(base)}/dav/</pre>
    <div class="kv small">
      <b>iPhone / iPad</b><span><b style="font:inherit;color:var(--text)">Apple's Files app can't use WebDAV.</b> Instead: <b>(1)</b> use NestNAS in Safari and tap Share → <i>Add to Home Screen</i> (it then opens like an app, and uploads straight from your Photos); or <b>(2)</b> install a free WebDAV app such as <i>Documents by Readdle</i> → Add connection → WebDAV → this address, with your NestNAS username and password.</span>
      <b>Android</b><span>Open NestNAS in Chrome → ⋮ → <i>Add to Home screen</i>. Or use a WebDAV app (e.g. Solid Explorer, CX File Explorer) with this address.</span>
      <b>Mac</b><span>Finder → Go → <i>Connect to Server…</i> (⌘K) → paste the address</span>
      <b>Linux</b><span>Files → <i>Other Locations</i> → paste <code>${s.tls.enabled ? "davs" : "dav"}://${esc(hostport)}/dav/</code></span>
      <b>Windows</b><span>This PC → <i>Map network drive</i> → paste the address. Windows needs the NestNAS certificate installed first (Security tab); over HTTPS it then works normally.</span>
    </div>
  </div>
  <div class="card">${cardHead("link", `Remote <em>access</em>`, `<span class="pill ${r.connected ? "ok" : "bad"}">${r.connected ? "Connected" : r.installed ? "Not signed in" : "Not installed"}</span>`)}
    ${r.connected ? `<p>Reach your NAS anywhere at <code>https://${esc(r.IP || r.ip)}:${esc(s.tls.port)}</code> from any device signed in to your Tailscale account.</p>` :
    `<p class="mute small">Uses free Tailscale: a private encrypted link, no router settings or port-forwarding. Your NAS is never exposed to the open internet.</p><pre>${esc(r.hint)}</pre>`}</div>
  <div class="card">${cardHead("drive", `Disk <em>usage</em>`)}<p class="small mute">Files live in <code>${esc(s.storage_path)}</code>. Disk: ${fmt(s.disk_free)} free of ${fmt(s.disk_total)}. Space promised to users: ${fmt(s.allotted)}.
    ${s.allotted > s.disk_free && s.disk_free ? "<br><b style='color:var(--bad)'>Warning:</b> user allowances add up to more than the free disk space." : ""}</p></div>`;
}

/* ---------------- Security ---------------- */
function modal(html) {
  const ov = document.createElement("div"); ov.className = "sheet-ov";
  ov.innerHTML = `<div class="sheet" style="padding-bottom:22px">${html}</div>`;
  document.body.appendChild(ov);
  ov.onclick = ev => { if (ev.target === ov) ov.remove(); };
  return ov;
}

function enableEncryption() {
  const ov = modal(`<div class="sheet-t">Turn on encryption</div>
    <p class="small mute">Every file you have stored will be encrypted in place, in the background. You keep using NestNAS as normal. You will get a recovery key to save: it is the only way back in if you forget the passphrase.</p>
    <label>Passphrase (12+ characters)</label><input id="p1" type="password" autocomplete="new-password">
    <label>Repeat passphrase</label><input id="p2" type="password" autocomplete="new-password">
    <div class="err" id="me"></div>
    <div class="toolbar"><button id="mo">Encrypt my files</button><button class="ghost" id="mc">Cancel</button></div>`);
  $("mc").onclick = () => ov.remove(); $("p1").focus();
  $("mo").onclick = async () => {
    if ($("p1").value !== $("p2").value) { $("me").textContent = "The passphrases don't match"; return; }
    $("mo").disabled = true;
    try { const r = await api("/api/vault/convert", { body: { mode: "encrypt", passphrase: $("p1").value } }); ov.remove(); state.tab = "security"; state.encrypted = true; viewRecovery(r.recovery_key); }
    catch (er) { $("me").textContent = er.message; $("mo").disabled = false; }
  };
}

function disableEncryption() {
  const ov = modal(`<div class="sheet-t">Turn off encryption</div>
    <p class="small mute">Every file will be decrypted back into an ordinary file on the drive. Anyone who has the drive will be able to read them. Enter your passphrase or recovery key to continue.</p>
    <label>Passphrase or recovery key</label><input id="p1" type="password" autocomplete="current-password">
    <div class="err" id="me"></div>
    <div class="toolbar"><button class="danger" id="mo">Decrypt my files</button><button class="ghost" id="mc">Cancel</button></div>`);
  $("mc").onclick = () => ov.remove(); $("p1").focus();
  $("mo").onclick = async () => {
    $("mo").disabled = true;
    try { await api("/api/vault/convert", { body: { mode: "decrypt", passphrase: $("p1").value } }); ov.remove(); state.encrypted = false; tabSecurity(); }
    catch (er) { $("me").textContent = er.message; $("mo").disabled = false; }
  };
}

async function tabSecurity() {
  const m = $("main"); const s = await api("/api/system"); const t = s.tls, e = s.encryption;
  const addr = (s.urls[0] || "https://YOUR-IP:8443");
  m.innerHTML = head("06", "Encryption", "", "Security", "Encryption in transit and at rest.") + `
  <div class="card">${cardHead("shield", `In transit: <em>HTTPS</em>`, `<span class="pill ${t.enabled ? "ok" : "bad"}">${t.enabled ? "TLS 1.3 on" : "Off"}</span>`)}
    <p class="small">Everything between your other devices and this computer is encrypted (TLS 1.3, ECDSA P-256). Plain HTTP only works on this computer itself, where it never touches the network.</p>
    ${t.enabled ? `<p class="small">Address for other devices: <code>${esc(addr)}</code></p>
    ${t.setup_urls && t.setup_urls.length ? `<p class="small"><b>Recommended:</b> on the new phone or computer, open this in its browser (on your own Wi-Fi) and follow the page: <code>${esc(t.setup_urls[0])}</code><br><span class="mute">It only offers the public certificate; nothing else on your NAS is reachable there.</span></p>` : ""}
    <p class="small"><b>One-time step per device:</b> install NestNAS's certificate so the device trusts it. It is limited to private network addresses, so it can never be used to impersonate a public website.</p>
    <div class="toolbar"><a href="/NestNAS.mobileconfig"><button>${ico("download")} iPhone / iPad / Mac profile</button></a><a href="/ca.crt"><button class="ghost">Certificate (.crt)</button></a><a href="/ca.cer"><button class="ghost">Binary (.cer)</button></a></div>
    <p class="mute small" style="margin-top:14px">Check on the new device that the fingerprint matches before trusting:</p>
    <pre style="font-size:12px;white-space:pre-wrap;word-break:break-all">${esc(t.fingerprint)}</pre>
    <details><summary class="small">How to install it</summary><div class="kv small" style="margin-top:8px">
      <b>iPhone / iPad</b><span>In <b>Safari</b> (not Chrome or another app) open <code>${esc((t.setup_urls && t.setup_urls[0]) || addr)}</code> and tap <i>Download the NestNAS profile</i>. Tap <i>Allow</i> → Settings → <i>Profile Downloaded</i> → Install (it says "Not Signed"; that's normal). Then Settings → General → About → <i>Certificate Trust Settings</i> → turn on <i>NestNAS Local CA</i>.</span>
      <b>Mac</b><span>Double-click the file → Keychain Access opens → double-click the certificate → Trust → <i>Always Trust</i>.</span>
      <b>Windows</b><span>Double-click the file → Install Certificate → Local Machine → place in <i>Trusted Root Certification Authorities</i>.</span>
      <b>Android</b><span>Settings → Security → Encryption &amp; credentials → Install a certificate → <i>CA certificate</i>.</span>
      <b>Linux</b><span><code>sudo cp NestNAS-CA.crt /usr/local/share/ca-certificates/ &amp;&amp; sudo update-ca-certificates</code> (Firefox keeps its own list: Settings → Certificates).</span>
    </div></details>` : `<p class="small mute">Start NestNAS without <code>--tls-port -1</code> to turn HTTPS on.</p>`}</div>
  <div class="card" id="encCard">${cardHead("lock", `At rest: <em>file encryption</em>`, `<span class="pill ${e.convert.running ? "ok" : e.enabled ? (e.locked ? "bad" : "ok") : "bad"}">${e.convert.running ? (e.convert.mode === "decrypt" ? "Decrypting" : "Encrypting") : e.enabled ? (e.locked ? "On · locked" : "On") : "Off"}</span>`)}
    <div class="trow" style="border-top:0;padding-top:4px"><div><b>Encrypt my files</b><span>${e.enabled ? "Every file is stored encrypted on the drive. Turn off to decrypt everything back into ordinary files." : "Turn on to encrypt every file on the drive. You can still view and upload files in NestNAS as usual."}</span></div><button class="sw ${e.enabled ? "on" : ""}" id="enc" role="switch" aria-checked="${!!e.enabled}" aria-label="Encrypt my files"${e.convert.running ? " disabled" : ""}></button></div>
    <div id="cv"></div>
    ${e.enabled ? `<p class="small">Files are encrypted with AES-256-GCM before they are written to the drive, each with its own key. The key is protected by your passphrase (memory-hard scrypt) and a recovery key. Tampering with a file on disk is detected.</p>
      <p class="small mute">Not hidden: file and folder <i>names</i>, sizes and dates. File <i>contents</i> are encrypted.</p>
      ${e.locked ? `<div class="trow"><div><b>Files are locked</b><span>Enter your passphrase to open files in NestNAS.</span></div><button class="ghost" id="lk">${ico("lock")} Unlock</button></div>` : ""}
      <div class="trow"><div><b>Open files without asking after a restart</b><span>${e.auto_unlock ? "On: the key is kept on this computer's disk, so NestNAS opens your files by itself. This protects a stolen drive, but not a stolen laptop." : "Off: after each restart you enter the passphrase. This is the strongest setting."}</span></div><button class="sw ${e.auto_unlock ? "on" : ""}" id="au" role="switch" aria-checked="${!!e.auto_unlock}" aria-label="Open files without asking after a restart"></button></div>
      <div class="toolbar"><button class="ghost" id="cpw">${ico("key")} Change passphrase</button></div>
      <p class="mute small">With encryption on, apps that read your files directly (such as Jellyfin's media library) can't be used; the web app and WebDAV work normally.</p>`
    : `<p class="small mute">With encryption off, files are stored as ordinary files that anyone with the drive can read. Turning it on converts the files already stored, in the background.</p>`}</div>`;
  const lk = $("lk"); if (lk) lk.onclick = guard(async () => {
    const p = prompt("Enter your passphrase or recovery key"); if (!p) return;
    await api("/api/vault/unlock", { body: { secret: p } }); toast("Files unlocked"); boot();
  });
  // Progress of turning encryption on or off.
  const cv = $("cv"), c = e.convert;
  if (cv && (c.running || e.pending)) {
    const pct = c.total ? Math.round(100 * c.done / c.total) : 0;
    cv.innerHTML = c.running
      ? `<div class="small" style="padding:6px 0 12px">${c.mode === "decrypt" ? "Decrypting" : "Encrypting"} your files: ${c.done} of ${c.total}. You can keep using NestNAS meanwhile.<div class="bar" style="margin-top:8px"><div style="width:${pct}%"></div></div></div>`
      : `<div class="small" style="padding:6px 0 12px">${esc(c.error || "The " + e.pending + "ion of your files was interrupted.")} <button class="ghost" id="rs">Resume</button></div>`;
    const rs = $("rs"); if (rs) rs.onclick = guard(async () => { await api("/api/vault/convert", { body: { mode: "resume" } }); tabSecurity(); });
    if (c.running) setTimeout(() => { if (state.tab === "security" && $("cv")) tabSecurity(); }, 1500);
  }
  const enc = $("enc"); if (enc) enc.onclick = () => e.enabled ? disableEncryption() : enableEncryption();
  const cpw = $("cpw"); if (cpw) cpw.onclick = guard(async () => {
    const o = prompt("Current passphrase"); if (!o) return; const n = prompt("New passphrase (12+ characters)"); if (!n) return;
    if (prompt("Type the new passphrase again") !== n) { toast("They didn't match"); return; }
    await api("/api/vault/passphrase", { body: { old: o, new: n } }); toast("Passphrase changed. Your recovery key still works.");
  });
  const au = $("au"); if (au) au.onclick = guard(async () => {
    if (e.auto_unlock) { await api("/api/vault/autounlock", { body: { enable: false } }); toast("Auto-unlock is off"); }
    else { const p = prompt("Enter your passphrase to turn on auto-unlock.\nAnyone with physical access to this laptop could then read your files."); if (!p) return; await api("/api/vault/autounlock", { body: { enable: true, secret: p } }); toast("Auto-unlock is on"); }
    tabSecurity();
  });
}

/* ---------------- Apps ---------------- */
async function tabApps() {
  const m = $("main"); const d = await api("/api/apps");
  if (!d.docker.running) {
    m.innerHTML = head("07", "Extensions", "", "Apps", "Install optional applications that run alongside your files.") + `<div class="card">${cardHead("apps", `Docker <em>required</em>`)}<p class="mute">${d.docker.installed ? esc(d.docker.hint) : "Docker lets NestNAS install apps like Jellyfin with one click. Install it with:"}</p>${d.docker.installed ? "" : `<pre>${esc(d.docker.hint)}</pre>`}</div>`; return;
  }
  const host = location.hostname;
  m.innerHTML = head("07", "Extensions", "", "Apps") + `<div class="apps">${d.apps.map(a => `<div class="card"><div class="ch"><span class="appic">${esc(a.Name.slice(0, 1))}</span><h3>${esc(a.Name)}</h3>${a.State ? `<span class="pill ${a.State === "running" ? "ok" : "bad"}">${esc(a.State)}</span>` : ""}</div>
    <p class="mute small">${esc(a.Desc)}</p>
    <div class="toolbar">${a.State ? `<a href="http://${esc(host)}:${esc(a.Ports[0])}" target="_blank" rel="noopener"><button>Open</button></a> <button class="danger" data-rm="${a.ID}">Remove</button>`
              : `<button data-in="${a.ID}">Install</button>`}</div></div>`).join("")}</div>
    <p class="mute small" style="margin-top:16px">Removing an app keeps its data in <code>apps/</code> inside your storage folder.</p>`;
  m.querySelectorAll("[data-in]").forEach(b => b.onclick = guard(async () => { b.disabled = true; b.textContent = "Installing… (first time downloads the app)"; try { await api("/api/apps/install", { body: { id: b.dataset.in } }); } finally { tabApps(); } }));
  m.querySelectorAll("[data-rm]").forEach(b => b.onclick = guard(async () => { if (confirm("Remove this app? Its data is kept.")) { await api("/api/apps/remove", { body: { id: b.dataset.rm } }); tabApps(); } }));
}

/* ---------------- People ---------------- */
async function tabUsers() {
  const m = $("main"); const d = await api("/api/users");
  m.innerHTML = head("08", "Administration", "", "Users", "Each person has a private folder and a storage limit.") + `<div class="card">
  <div class="tscroll"><table><thead><tr><th>Person</th><th>Used</th><th>Allowance (GB)</th><th></th></tr></thead><tbody>${d.users.map(u => `<tr><td><span class="ttl"><span class="avatar">${esc(u.name.slice(0, 1))}</span>${esc(u.name)} ${u.admin ? '<span class="pill">admin</span>' : ""}</span></td><td class="mute mono small">${fmt(u.used)}</td>
    <td><input type="number" min="1" step="1" value="${Math.round(u.quota / GB * 10) / 10}" data-q="${esc(u.name)}" style="width:100px;padding:8px 12px"></td>
    <td class="actions">${u.name === state.me.name ? "" : `<button class="danger" data-d="${esc(u.name)}">Delete</button>`}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card users-add">${cardHead("plus", `Add a <em>person</em>`)}<div class="row2"><div><label>Username</label><input id="nu"></div><div><label>Password (8+)</label><input id="np" type="password"></div>
  <div><label>Allowance (GB)</label><input id="nq" type="number" value="10" min="1"></div><div><label>&nbsp;</label><label class="ck" style="margin-top:12px!important"><input type="checkbox" id="na"> Make admin</label></div></div>
  <div class="err" id="e"></div><button id="add">${ico("plus")} Add person</button></div>`;
  m.querySelectorAll("[data-q]").forEach(i => i.onchange = guard(async () => { await api("/api/users/quota", { body: { name: i.dataset.q, quota_gb: +i.value } }); toast("Saved"); }));
  m.querySelectorAll("[data-d]").forEach(b => b.onclick = guard(async () => {
    if (!confirm(`Delete ${b.dataset.d}?`)) return;
    const wipe = confirm("Also permanently delete their files?\nOK = delete files too, Cancel = keep files on disk.");
    await api("/api/users/delete", { body: { name: b.dataset.d, delete_data: wipe } }); tabUsers();
  }));
  $("add").onclick = async () => { try { await api("/api/users/add", { body: { name: $("nu").value, password: $("np").value, quota_gb: +$("nq").value, admin: $("na").checked } }); tabUsers(); } catch (e) { $("e").textContent = e.message; } };
}

/* ---------------- Account ---------------- */
function tabAccount() {
  $("main").innerHTML = head("09", "Settings", "", "Account") + `<div class="card" style="max-width:520px">${cardHead("key", `Change <em>password</em>`)}
  <label>Current password</label><input id="o" type="password"><label>New password (8+)</label><input id="n" type="password">
  <div class="err" id="e"></div><button id="go">Change password</button></div>
  <div class="card" style="max-width:520px">${cardHead("link", `Public <em>website</em>`)}<p class="mute small">Put files in a folder named <code>site</code> in your Files and visit <code>/sites/${esc(state.me.name)}/</code>.</p></div>`;
  $("go").onclick = async () => { try { await api("/api/password", { body: { old: $("o").value, new: $("n").value } }); toast("Password changed"); $("o").value = $("n").value = ""; $("e").textContent = ""; } catch (e) { $("e").textContent = e.message; } };
}

boot();
